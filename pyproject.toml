[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskcli"
version = "0.1.0"
description = "Terminal risk report for a ticker: vol, drawdown, VaR/CVaR, Sharpe, CAPM beta and alpha"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Alexandros Chortis", email = "alexander.tux@gmail.com" }]
keywords = ["finance", "risk", "var", "sharpe", "cli", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/designed7000/Risk_Cli"
Issues = "https://github.com/designed7000/Risk_Cli/issues"

[project.scripts]
riskcli = "riskcli.cli:main"

[tool.setuptools.packages.find]
include = ["riskcli*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
